<svg viewBox="0 0 400 580" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <!-- Tło: papier -->
  <rect width="400" height="580" fill="#F7F4EF"/>

  <!-- Logo: biały kwadrat z cynobrową obwódką i kropką -->
  <rect x="168" y="116" width="64" height="64" rx="16" fill="#FFFFFF" stroke="#D9401E" stroke-width="2.5"/>
  <circle cx="200" cy="148" r="8" fill="#D9401E"/>

  <!-- Wordmark (serif) -->
  <text x="200" y="228" text-anchor="middle" font-size="36" font-weight="700" fill="#1C1814" font-family="ui-serif, Georgia, 'Iowan Old Style', 'Times New Roman', serif">Bez Filtra</text>

  <!-- Subtitle -->
  <text x="200" y="258" text-anchor="middle" font-size="13" fill="#6E655A">Odpowiedź na każde pytanie</text>

  <!-- Badge -->
  <text x="200" y="290" text-anchor="middle" font-size="10" fill="#948A7C" letter-spacing="2.5">BEZ CENZURY · BEZ TEMATÓW TABU</text>

  <!-- Password input -->
  <rect x="60" y="320" width="280" height="46" rx="10" fill="#FFFFFF" stroke="#D2C9B9" stroke-width="1"/>
  <text x="200" y="348" text-anchor="middle" font-size="13" fill="#948A7C">Hasło dostępu</text>

  <!-- Login button -->
  <rect x="60" y="382" width="280" height="46" rx="10" fill="#D9401E"/>
  <text x="200" y="411" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">Wejdź</text>
</svg>
