<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="refresh" content="8;url=https://bezfiltra.beer" />
  <title>Bez Filtra · przenosimy się</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #F7F4EF;
      color: #1C1814;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden; position: relative;
    }
    .card {
      position: relative; text-align: center;
      padding: 0 28px; max-width: 460px; width: 100%;
    }
    .logo {
      width: 52px; height: 52px; margin: 0 auto 26px;
      border-radius: 14px;
      border: 2px solid #D9401E;
      display: flex; align-items: center; justify-content: center;
      background: #FFFFFF;
    }
    .logo::after {
      content: ''; width: 14px; height: 14px; border-radius: 50%;
      background: #D9401E;
    }
    .wordmark {
      font-family: ui-serif, Georgia, 'Iowan Old Style', 'Times New Roman', serif;
      font-size: 2.1rem; font-weight: 700; letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .badge {
      display: inline-block; font-size: 11px; letter-spacing: 0.2em;
      text-transform: uppercase; color: #948A7C;
      margin-bottom: 28px;
    }
    .message {
      font-size: 1rem; line-height: 1.7;
      color: #6E655A;
      margin-bottom: 36px;
    }
    .message strong { color: #1C1814; }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      border-radius: 10px;
      background: #D9401E;
      color: #FFFFFF;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s;
    }
    .btn:hover { background: #B93316; transform: translateY(-1px); }
    .countdown {
      margin-top: 20px;
      font-size: 12px;
      color: #948A7C;
    }
    .countdown span {
      color: #6E655A;
      font-variant-numeric: tabular-nums;
    }
    .bar {
      margin: 32px auto 0; width: 200px; height: 2px; border-radius: 2px;
      background: #E5DED2; overflow: hidden; position: relative;
    }
    .bar::after {
      content: ''; position: absolute; top: 0; left: 0; height: 100%; width: 0;
      background: #D9401E;
      animation: fill 8s linear forwards;
    }
    @keyframes fill { from { width: 0; } to { width: 100%; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"></div>
    <div class="wordmark">Bez Filtra</div>
    <div class="badge">przenosimy się na nowy serwer</div>
    <p class="message">
      Ulepszyliśmy infrastrukturę - <strong>Bez Filtra</strong> działa teraz
      na dedykowanym serwerze z akceleracją GPU.<br /><br />
      Znajdziesz nas pod nowym adresem:
    </p>
    <a class="btn" href="https://bezfiltra.beer">
      Przejdź na bezfiltra.beer →
    </a>
    <div class="countdown">automatyczne przekierowanie za <span id="s">8</span> s</div>
    <div class="bar"></div>
  </div>

  <script>
    var s = 8
    var el = document.getElementById('s')
    var t = setInterval(function() {
      s--
      el.textContent = s
      if (s <= 0) { clearInterval(t); location.href = 'https://bezfiltra.beer' }
    }, 1000)
  </script>
</body>
</html>
