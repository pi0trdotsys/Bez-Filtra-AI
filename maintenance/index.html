<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="refresh" content="8" />
  <title>Bez Filtra · trwa aktualizacja</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #F7F4EF;
      color: #1C1814;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden; position: relative;
    }
    .card { position: relative; text-align: center; padding: 0 24px; max-width: 420px; }
    .gear {
      width: 64px; height: 64px; margin: 0 auto 26px;
      animation: spin 3.4s linear infinite;
      color: #D9401E;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .badge {
      display: inline-block; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
      color: #948A7C; margin-bottom: 14px;
    }
    h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 10px; }
    .wordmark { font-family: ui-serif, Georgia, 'Iowan Old Style', 'Times New Roman', serif; font-weight: 700; }
    p { font-size: 0.95rem; line-height: 1.6; color: #6E655A; }
    .bar {
      margin: 26px auto 0; width: 180px; height: 3px; border-radius: 3px;
      background: #E5DED2; overflow: hidden; position: relative;
    }
    .bar::after {
      content: ''; position: absolute; top: 0; left: 0; height: 100%; width: 40%;
      border-radius: 3px; background: #D9401E;
      animation: slide 1.6s ease-in-out infinite;
    }
    @keyframes slide { 0% { left: -40%; } 100% { left: 100%; } }
    .hint { margin-top: 18px; font-size: 12px; color: #948A7C; }
  </style>
</head>
<body>
  <div class="card">
    <svg class="gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="3" />
      <path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1" />
    </svg>

    <div class="badge">503 · usługa chwilowo niedostępna</div>
    <h1>Trwa aktualizacja</h1>
    <p>
      <span class="wordmark">Bez Filtra</span> właśnie się dopieszcza.<br/>
      Wracamy za moment - ta strona odświeży się sama.
    </p>

    <div class="bar"></div>
    <div class="hint">automatyczne odświeżanie co kilka sekund…</div>
  </div>
</body>
</html>
