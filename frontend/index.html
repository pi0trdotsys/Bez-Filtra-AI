<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Bez Filtra · odpowiedź na każde pytanie</title>
    <script>
      // Ustaw motyw przed pierwszym renderem (bez migotania).
      try {
        var t = localStorage.getItem('bf-theme') || 'light'
        var resolved = t === 'auto'
          ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : t
        document.documentElement.setAttribute('data-theme', resolved === 'dark' ? 'dark' : 'light')
      } catch (e) {}
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#D9401E" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F7F4EF'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23D9401E' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23D9401E'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
      <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () { navigator.serviceWorker.register("/sw.js").catch(function () {}) })
      }
    </script>
  </body>
</html>
